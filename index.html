<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: pełnoekranowa scena 3D; HUD w rogach — wynik lewa góra, mapa prawa góra, joystick lewy dół, uzbrojenie prawy dół */
:root{
  --sand:#e8b882;
  --ink:#2a1708;
  --white:#fffaf2;
  --glass:rgba(255,250,242,.2);
  --hot:#ff6b2c;
  --ok:#ffffff;
  --f-display:'Lilita One','Arial Rounded MT Bold','Arial Black',sans-serif;
  --f-ui:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--sand)}
body{height:100%;margin:0;overflow:hidden;background:var(--sand);color:var(--white);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:var(--sand)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:6;pointer-events:none}
.txt{text-shadow:0 3px 0 rgba(90,40,10,.35)}
#tl{top:calc(10px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
#score{font:400 46px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--white)}
.krow{display:flex;align-items:center;gap:6px;font:400 22px/1 var(--f-display);color:var(--white)}
.krow svg{width:24px;height:24px}
.best{font:800 12px/1.2 var(--f-ui);letter-spacing:.12em;color:rgba(255,250,242,.9);margin-top:2px}
#combo{left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:400 30px/1 var(--f-display);color:var(--white);letter-spacing:.02em}
#combo b{color:var(--hot);font-weight:400}
#combo.pop{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(1.5)}to{transform:translateX(-50%) scale(1)}}
#tr{top:calc(10px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:auto}
#mini{width:112px;height:112px;border-radius:14px;border:3px solid rgba(255,250,242,.85);box-shadow:0 4px 0 rgba(90,40,10,.25)}
.col{display:flex;flex-direction:column;gap:10px}
.ibtn{width:42px;height:42px;border-radius:12px;border:none;background:var(--glass);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--white);box-shadow:inset 0 0 0 2.5px rgba(255,250,242,.8)}
.ibtn svg{width:20px;height:20px}
.ibtn:focus-visible,#fire:focus-visible,#swap:focus-visible,.cta:focus-visible{outline:3px solid var(--white);outline-offset:3px}
#warn{left:50%;top:30%;transform:translateX(-50%);font:400 24px/1 var(--f-display);color:var(--white);white-space:nowrap;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#pops{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.popup{position:absolute;left:0;top:0;font:400 26px/1 var(--f-display);color:var(--white);white-space:nowrap;text-shadow:0 3px 0 rgba(90,40,10,.4);will-change:transform,opacity}
#zone{position:absolute;left:0;top:0;bottom:0;width:50%;z-index:3;touch-action:none}
#stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;z-index:4;pointer-events:none;background:rgba(255,250,242,.16);box-shadow:inset 0 0 0 3px rgba(255,250,242,.7);transition:opacity .2s}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--white);box-shadow:0 4px 0 rgba(90,40,10,.3)}
#arm{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:196px;height:176px}
#fire{position:absolute;right:0;bottom:18px;width:120px;height:120px;border-radius:50%;border:none;padding:0;background:rgba(255,250,242,.22);box-shadow:0 5px 0 rgba(90,40,10,.25);pointer-events:auto;cursor:pointer;touch-action:none;transition:transform .07s,background .07s}
#fire.on{transform:scale(.93);background:rgba(255,107,44,.55)}
#fire svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#fire .ico{position:absolute;left:50%;top:44%;width:56px;height:56px;transform:translate(-50%,-50%);color:var(--white);filter:drop-shadow(0 2px 0 rgba(90,40,10,.3))}
#fire .ammo{position:absolute;left:0;right:0;bottom:19px;text-align:center;font:400 17px/1 var(--f-display);color:var(--white);font-variant-numeric:tabular-nums}
#fire.empty .ammo{color:var(--hot)}
#fire.empty .ico{opacity:.45}
#swap{position:absolute;left:0;top:0;width:66px;height:66px;border-radius:50%;border:none;background:rgba(255,250,242,.2);box-shadow:inset 0 0 0 2.5px rgba(255,250,242,.75),0 4px 0 rgba(90,40,10,.2);padding:0;pointer-events:auto;cursor:pointer;touch-action:none;display:grid;place-items:center}
#swap .ico{width:30px;height:30px;color:var(--white);margin-top:-8px}
#swap span{position:absolute;bottom:9px;left:0;right:0;text-align:center;font:900 9px/1 var(--f-ui);letter-spacing:.14em;color:var(--white)}
#wname{position:absolute;right:-16px;bottom:0;width:152px;text-align:center;font:900 10px/1 var(--f-ui);letter-spacing:.14em;color:var(--white);white-space:nowrap;text-shadow:0 1px 0 rgba(90,40,10,.4)}
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(214,140,82,.45);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.card{max-width:560px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:16px}
.logo{margin:0;font:400 clamp(72px,17vw,148px)/.85 var(--f-display);color:var(--white);letter-spacing:.01em;text-shadow:0 6px 0 #b4552a,0 14px 0 rgba(90,40,10,.25)}
.sub{font:900 13px/1.3 var(--f-ui);letter-spacing:.3em;color:var(--white);text-transform:uppercase}
.rules{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{font:800 14px/1.2 var(--f-ui);color:var(--ink);background:rgba(255,250,242,.85);border-radius:999px;padding:7px 12px}
.cta{font:400 28px/1 var(--f-display);letter-spacing:.04em;color:#fff;background:var(--hot);border:none;border-radius:18px;padding:16px 44px 14px;cursor:pointer;box-shadow:0 6px 0 #a83d12,0 12px 24px rgba(90,40,10,.25)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a83d12}
.hint{font:800 13px/1.3 var(--f-ui);color:rgba(255,250,242,.95)}
#rotate{z-index:40;background:#d98a52}
#err{position:absolute;inset:auto 16px 16px;z-index:30;font:800 14px/1.4 var(--f-ui);color:var(--ink);background:#fffaf2;border-radius:10px;padding:10px 14px}
@media (max-height:500px){.card{gap:10px}.logo{font-size:96px}.cta{padding:12px 36px 10px;font-size:24px}}
@media (prefers-reduced-motion:reduce){#warn,#combo.pop{animation:none}}
</style>
</head>
<body>
<div id="game">

    <div class="krow"><svg viewBox="0 0 24 24" fill="#fffaf2"><path d="M12 2C6.9 2 3 5.6 3 10.2c0 2.6 1.3 4.6 3 5.8V19a1 1 0 0 0 1 1h1.5v-2h1.5v2h4v-2h1.5v2H17a1 1 0 0 0 1-1v-3c1.7-1.2 3-3.2 3-5.8C21 5.6 17.1 2 12 2zM8.5 13.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM12 14l1.2 2h-2.4z"/></svg><span id="kills">0</span></div>

      <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,250,242,.25)" stroke-width="6"/><circle id="ammoRing" cx="60" cy="60" r="54" fill="none" stroke="#fffaf2" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>
      <svg class="ico" id="fireIco" viewBox="0 0 64 64"></svg>

  <div class="overlay" id="start">

        <span class="chip">Lewa strona: joystick</span>
        <span class="chip">Przytrzymaj ogień</span>

  <div id="err" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('err').hidden = false; $('err').textContent = 'Nie udało się wczytać silnika 3D. Odśwież stronę.'; return; }
const T3 = THREE;

/* ================= NARZĘDZIA ================= */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
const rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash2=(x,y)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+1013904223)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;};
const hf=(i,j)=>hash2(i,j)/4294967296;
function vn(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hf(i,j),b=hf(i+1,j),c=hf(i,j+1),d=hf(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

/* ================= ŚWIAT ================= */
const WORLD=4000, CH=80, SEG=20, WIND=0.55;
const R=mulberry32(20261025), rg=(a,b)=>a+R()*(b-a);
const START={x:2000,z:2000};
const mountains=[], oases=[];
const MB=300, MBN=Math.ceil(WORLD/MB)+1, mBuck=[], oBuck=[];
function bucketAdd(arr,o,rad){const a=Math.floor((o.x-rad)/MB),b=Math.floor((o.x+rad)/MB),c=Math.floor((o.z-rad)/MB),d=Math.floor((o.z+rad)/MB);
  for(let j=c;j<=d;j++)for(let i=a;i<=b;i++){if(i<0||j<0||i>=MBN||j>=MBN)continue;const k=i+j*MBN;(arr[k]||(arr[k]=[])).push(o);}}
function addRange(x,z,ang,n,r0){for(let i=0;i<n;i++){const r=r0*rg(.7,1.15);const m={x,z,r,h:rg(40,85)*(r/r0),s:R()*100};mountains.push(m);bucketAdd(mBuck,m,r);const st=r*rg(.7,1.05);x+=Math.cos(ang)*st;z+=Math.sin(ang)*st;ang+=rg(-.5,.5);}}
addRange(START.x-330,START.z+360,.3,3,140);
for(let i=0;i<16;i++){let x,z,t=0;do{x=rg(400,WORLD-400);z=rg(400,WORLD-400);t++;}while(Math.hypot(x-START.x,z-START.z)<600&&t<40);addRange(x,z,R()*TAU,2+Math.floor(R()*3),rg(110,200));}
function nearMountain(x,z,pad){const L=mBuck[Math.floor(x/MB)+Math.floor(z/MB)*MBN];if(!L)return false;for(const m of L)if(Math.hypot(x-m.x,z-m.z)<m.r+pad)return true;return false;}
function addOasis(x,z,r){const o={x,z,r};oases.push(o);bucketAdd(oBuck,o,r*3.6);}
addOasis(START.x+160,START.z-90,26);
for(let i=0;i<16;i++){let x,z,t=0;do{x=rg(400,WORLD-400);z=rg(400,WORLD-400);t++;}while((nearMountain(x,z,90)||Math.hypot(x-START.x,z-START.z)<300)&&t<60);addOasis(x,z,rg(18,34));}

const INFO={mt:0,oz:0,sea:0};
const CW=Math.cos(WIND),SW=Math.sin(WIND);
function terr(x,z,info){
  const wx=x*CW+z*SW,wz=-x*SW+z*CW;
  // morza wydm (rozległe) i płaskie równiny pomiędzy nimi
  const sea=clamp(vn(x*.0009+11,z*.0009+5)*2.1-.6,0,1);
  const warp=vn(x*.0028,z*.0028)*1.6+vn(wz*.0016,4.1)*2.4;
  const ph=wx*.0024+warp;const s=ph-Math.floor(ph);
  // profil asymetryczny: łagodne zbocze nawietrzne, strome zawietrzne
  const p=s<.76?(1-Math.cos(s/.76*Math.PI))/2:(1+Math.cos((s-.76)/.24*Math.PI))/2;
  const amp=(14+30*vn(wz*.0035+2,wx*.0012))*sea;
  let h=p*p*amp+vn(x*.0035,z*.0035)*9+vn(x*.012,z*.012)*1.6;
  let mt=0,oz=0;
  const bi=Math.floor(x/MB),bj=Math.floor(z/MB);
  if(bi>=0&&bj>=0&&bi<MBN&&bj<MBN){
    const L=mBuck[bi+bj*MBN];if(L)for(const m of L){const dx=x-m.x,dz=z-m.z;const d2=dx*dx+dz*dz;if(d2>m.r*m.r)continue;const t=1-Math.sqrt(d2)/m.r;const st=t*t*(3-2*t);
      const rough=.65+.5*vn(x*.03+m.s,z*.03)+.2*vn(x*.11,z*.11);const plateau=Math.min(st*1.35,1);h+=m.h*plateau*rough;if(st>mt)mt=st;}
    const O=oBuck[bi+bj*MBN];if(O)for(const o of O){const d=Math.hypot(x-o.x,z-o.z);if(d>o.r*3.6)continue;const t=sstep(o.r*3.4,o.r*.75,d);h=lerp(h,-2.6,t);oz=Math.max(oz,sstep(o.r*3.6,o.r*1.3,d));}
  }
  const e=Math.min(x,z,WORLD-x,WORLD-z);if(e<220){const t=1-Math.max(e,0)/220;const st=t*t;h+=st*95*(.7+.6*vn(x*.03,z*.03));mt=Math.max(mt,st);}
  if(info){info.mt=mt;info.oz=oz;info.sea=sea;}
  return h;
}

/* ================= RENDERER ================= */
const cv=$('c'),gameEl=$('game');
const renderer=new T3.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T3.PCFSoftShadowMap;
const scene=new T3.Scene();
const SKY=0xe2b27f;scene.background=new T3.Color(SKY);scene.fog=new T3.Fog(SKY,230,430);
const camera=new T3.PerspectiveCamera(38,1,5,800);
scene.add(new T3.HemisphereLight(0xfbe3c8,0xb7764a,.62));
const sun=new T3.DirectionalLight(0xfff0dc,.72);
const SUN=new T3.Vector3(.42,.9,-.36).normalize();
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-170,right:170,top:170,bottom:-170,near:10,far:600});
sun.shadow.bias=-.0005;sun.shadow.normalBias=.05;
scene.add(sun);scene.add(sun.target);

// tekstura piasku: ziarno i zmarszczki wiatrowe
const sandTex=(()=>{const S=512,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');const img=g.createImageData(S,S),d=img.data;const rng=mulberry32(77);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const i=(y*S+x)*4;const rip=Math.sin((x*.72+y*.31)*.42+Math.sin(y*.05+x*.013)*2.2)*.5+.5;const n=rng();
    let v=232+rip*14+(n-.5)*22;if(n<.012)v-=60;else if(n>.992)v=255;d[i]=v;d[i+1]=v*.985;d[i+2]=v*.965;d[i+3]=255;}
  g.putImageData(img,0,0);const t=new T3.CanvasTexture(c);t.wrapS=t.wrapT=T3.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;})();
const matTerr=new T3.MeshLambertMaterial({vertexColors:true,map:sandTex});
const matV=new T3.MeshLambertMaterial({vertexColors:true});
const matS=new T3.MeshStandardMaterial({vertexColors:true,roughness:.7,metalness:.08});
const matWreck=new T3.MeshStandardMaterial({vertexColors:true,color:0x4a3f38,roughness:.95,metalness:0});

/* ---- scalanie geometrii ---- */
const _v=new T3.Vector3(),_n=new T3.Vector3(),_m3=new T3.Matrix3(),_c=new T3.Color();
function prep(g){const n=g.index?g.toNonIndexed():g;n.computeVertexNormals();return n;}           // płaskie
function prepS(g){g.computeVertexNormals();return g.index?g.toNonIndexed():g;}                     // gładkie
const MAT=(x,y,z,rx,ry,rz,sx,sy,sz)=>{const o=new T3.Object3D();o.position.set(x||0,y||0,z||0);o.rotation.set(rx||0,ry||0,rz||0);o.scale.set(sx||1,sy==null?(sx||1):sy,sz==null?(sx||1):sz);o.updateMatrix();return o.matrix.clone();};
function mergeParts(parts){
  let total=0;for(const p of parts)total+=p.g.attributes.position.count;
  const pos=new Float32Array(total*3),nor=new Float32Array(total*3),col=new Float32Array(total*3);let o=0;
  for(const p of parts){const Pp=p.g.attributes.position.array,N=p.g.attributes.normal.array,cnt=p.g.attributes.position.count;
    _c.set(p.c);if(p.cm){_c.r*=p.cm;_c.g*=p.cm;_c.b*=p.cm;}
    if(p.m)_m3.getNormalMatrix(p.m);
    for(let i=0;i<cnt;i++){_v.set(Pp[i*3],Pp[i*3+1],Pp[i*3+2]);_n.set(N[i*3],N[i*3+1],N[i*3+2]);if(p.m){_v.applyMatrix4(p.m);_n.applyMatrix3(_m3).normalize();}
      pos[o]=_v.x;pos[o+1]=_v.y;pos[o+2]=_v.z;nor[o]=_n.x;nor[o+1]=_n.y;nor[o+2]=_n.z;col[o]=_c.r;col[o+1]=_c.g;col[o+2]=_c.b;o+=3;}}

// loft: przekroje (tablice punktów 3D) łączone w gładką powłokę; normalne zawsze na zewnątrz

  const capF=(si,flip)=>{const s=secs[si];let cx=0,cy=0,cz=0;for(const p of s){cx+=p[0];cy+=p[1];cz+=p[2];}const ci=pos.length/3;pos.push(cx/n,cy/n,cz/n);
    for(let i=0;i<n;i++){const a=si*n+i,b=si*n+(i+1)%n;flip?idx.push(ci,b,a):idx.push(ci,a,b);}};

  // celownik
  const D=Wp.cur==='gun'?GUN_D:RKT_D;if(P.man){retGun.visible=retRkt.visible=false;}const rx=P.x+c*D,rz=P.z+s*D;const ret=Wp.cur==='gun'?retGun:retRkt;
  retGun.visible=running&&!P.man&&Wp.cur==='gun';retRkt.visible=running&&!P.man&&Wp.cur==='rkt';ret.position.set(rx,terr(rx,rz)+.4,rz);ret.rotation.y=-P.a;
  retMat.color.set((Wp.cur==='gun'?Wp.gun<1:Wp.rkt<1)?0xff6b2c:0xffffff);

  // pociski
  let tn=0;
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.t+=dt;if(b.t>=b.T){impactGun(b.ex,b.ey,b.ez);bullets[i]=bullets[bullets.length-1];bullets.pop();}}
  for(const b of bullets){if(!b.tr||tn>=PTRAC.cap)continue;const u=b.t/b.T,u0=Math.max(0,u-.2);
    const x1=lerp(b.sx,b.ex,u),y1=lerp(b.sy,b.ey,u),z1=lerp(b.sz,b.ez,u),x0=lerp(b.sx,b.ex,u0),y0=lerp(b.sy,b.ey,u0),z0=lerp(b.sz,b.ez,u0);
    dummy.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);dummy.scale.set(1,1,Math.hypot(x1-x0,y1-y0,z1-z0)+.1);dummy.lookAt(x1,y1,z1);dummy.updateMatrix();
    PTRAC.m.setMatrixAt(tn,dummy.matrix);PTRAC.m.setColorAt(tn,tmpC.setRGB(1,.86+Math.random()*.1,.45));tn++;}
  PTRAC.m.count=tn;PTRAC.m.instanceMatrix.needsUpdate=true;if(PTRAC.m.instanceColor)PTRAC.m.instanceColor.needsUpdate=true;
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.t+=dt;const u=Math.min(1,r.t/r.T);
    const nx=lerp(r.sx,r.ex,u),nz=lerp(r.sz,r.ez,u),ny=lerp(r.sy,r.ey,u)+Math.sin(u*Math.PI)*2;
    r.m.position.set(nx,ny,nz);r.m.lookAt(nx+(nx-r.x),ny+(ny-r.y),nz+(nz-r.z));r.x=nx;r.y=ny;r.z=nz;
    puff(nx,ny,nz,rnd(-1,1),rnd(0,1.5),rnd(-1,1),.5,1.8,0xf1ebe0,rnd(.7,1.1),1.5);glow(nx,ny,nz,0,0,0,.6,.2,.06,2);
    if(u>=1){impactRocket(r.ex,r.ey,r.ez);r.m.visible=false;rockets.splice(i,1);}}

  // czołgi
  let alive=0;const bq=camera.quaternion;
  for(let i=tanks.length-1;i>=0;i--){const t=tanks[i];
    if(t.alive){alive++;
      t.think-=dt;if(t.think<=0){t.think=rnd(2.5,7);t.da=t.a+rnd(-1.1,1.1);}
      if(blocked(t.x+Math.cos(t.a)*16,t.z+Math.sin(t.a)*16)){t.da=t.a+t.side*1.5;}
      const dd=wrapA(t.da-t.a);t.a=wrapA(t.a+clamp(dd,-.55*dt,.55*dt));
      const sp=t.sp*(1-Math.min(1,Math.abs(dd))*.55);const nx=t.x+Math.cos(t.a)*sp*dt,nz=t.z+Math.sin(t.a)*sp*dt;
      if(!blocked(nx,nz)){t.x=nx;t.z=nz;}else t.a+=t.side*dt;
      const pd=Math.hypot(P.x-t.x,P.z-t.z);const ta=pd<260?Math.atan2(P.z-t.z,P.x-t.x):t.a;t.ta=wrapA(t.ta+clamp(wrapA(ta-t.ta),-1.1*dt,1.1*dt));
      const near=Math.abs(t.x-cam.x)<260&&Math.abs(t.z-cam.z)<260;
      if(near){placeTank(t,dt);t.crush-=dt;if(t.crush<=0){t.crush=.3;smashCacti(t.x,t.z,4.5);}
        if(Math.random()<dt*2.5)puff(t.x-Math.cos(t.a)*5,t.y+.6,t.z-Math.sin(t.a)*5,rnd(-1,1),rnd(.5,1.5),rnd(-1,1),.6,2.2,0xe2b583,1.2,1);}
      else{t.y=terr(t.x,t.z);t.g.position.set(t.x,t.y,t.z);}
      t.hit=Math.max(0,t.hit-dt);
      const f=t.hp/t.max;t.bg.visible=t.fg.visible=near;
      if(near){t.bg.position.set(t.x,t.y+9.5,t.z);t.bg.quaternion.copy(bq);t.bg.scale.set(8.4,1.5,1);
        t.fg.quaternion.copy(bq);t.fg.scale.set(Math.max(.01,8*f),1.1,1);_v.set(-(8-8*f)/2,0,0).applyQuaternion(bq);t.fg.position.set(t.x+_v.x,t.y+9.5+_v.y,t.z+_v.z);
        t.fm.color.set(t.hit>0?0xffffff:f>.6?0x7be05a:f>.3?0xf4c63a:0xf2522f);}
    }else{
      t.burn-=dt;t.wreck-=dt;
      if(t.tFly){const fl=t.tFly;fl.vy-=30*dt;t.tur.position.x+=fl.vx*dt;t.tur.position.y+=fl.vy*dt;t.tur.position.z+=fl.vz*dt;t.tur.rotation.x+=fl.wx*dt;t.tur.rotation.z+=fl.wz*dt;
        if(Math.random()<.6)puff(t.tur.position.x,t.tur.position.y,t.tur.position.z,0,1,0,.6,2,0x3b3430,1.2,1);
        const g=terr(t.tur.position.x,t.tur.position.z)+.6;if(t.tur.position.y<g&&fl.vy<0){t.tur.position.y=g;t.tFly=null;for(let k=0;k<6;k++){const a=k/6*TAU;puff(t.tur.position.x,g,t.tur.position.z,Math.cos(a)*8,1,Math.sin(a)*8,1,2.4,0xdcae7c,.9,3);}}}
      const near=Math.abs(t.x-cam.x)<280&&Math.abs(t.z-cam.z)<280;
      if(near&&t.burn>0){const k=t.burn/11;if(Math.random()<dt*14*k)glow(t.x+rnd(-2,2),t.y+rnd(2,3.5),t.z+rnd(-2,2),rnd(-1,1),rnd(4,8),rnd(-1,1),rnd(.8,1.4),rnd(1.6,2.4),rnd(.4,.7));
        if(Math.random()<dt*9)puff(t.x+rnd(-1.5,1.5),t.y+3,t.z+rnd(-1.5,1.5),rnd(.5,2),rnd(5,8),rnd(-1,1),rnd(1,1.6),rnd(3.5,5.5),Math.random()<.5?0x2e2925:0x4a423c,rnd(2.6,4.2),.4);}
      else if(near&&t.wreck>15&&Math.random()<dt*2.5)puff(t.x,t.y+2.5,t.z,rnd(.5,1.5),rnd(3,5),0,.8,3,0x8f8780,rnd(2.5,3.5),.4);
      if(t.wreck<=0){if(t.wreck<-1.2){scene.remove(t.g,t.tur,t.bg,t.fg);t.fm.dispose();tanks.splice(i,1);}else{t.g.position.y-=dt*3;t.tur.position.y-=dt*3;}}
    }}
  if(alive<TARGET){spawnCd-=dt;if(spawnCd<=0){spawnCd=1.4;const sp=findSpot(P.x,P.z,260,620);if(sp)spawnGroup(sp[0],sp[1]);}}

  updPools(dt);updPops(dt);
  shake=Math.max(0,shake-dt*7);comboT=Math.max(0,comboT-dt);
}

/* ================= PĘTLA ================= */
let W=1,H=1,dpr=1;
function resize(){checkOrient();const r=gameEl.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,2);
  renderer.setPixelRatio(dpr);renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
  mini.width=mini.height=Math.round(112*dpr);if(stick.id===null)stickHome();}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);
let last=performance.now(),miniT=0;
function loop(now){let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(!paused){update(dt);updateChunks(cam.x,cam.z,2);renderer.render(scene,camera);miniT-=dt;if(miniT<=0){miniT=.12;drawMini();}updHud();}
  requestAnimationFrame(loop);}
const startEl=$('start'),goBtn=$('go');
function checkOrient(){const portrait=window.innerHeight>window.innerWidth;$('rotate').hidden=!portrait;if(portrait&&running&&!paused)togglePause();}
addEventListener('orientationchange',()=>setTimeout(resize,250));
function startGame(){if(window.innerHeight>window.innerWidth)return;try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}initAudio();startEl.hidden=true;if(paused){paused=false;last=performance.now();if(AC)AC.resume();return;}running=true;updHud();}
function togglePause(){paused=!paused;if(paused){Wp.fire=false;fireBtn.classList.remove('on');setBrrr(false);goBtn.textContent='GRAJ DALEJ';startEl.hidden=false;if(AC)AC.suspend();}else{startEl.hidden=true;if(AC)AC.resume();last=performance.now();}}
goBtn.addEventListener('click',startGame);
$('pause').addEventListener('click',()=>{if(running)togglePause();});
function setMute(m){muted=m;$('mwave').style.display=m?'none':'';$('mx').hidden=!m;if(master)master.gain.value=m?0:.85;try{localStorage.setItem('brrrt_mute',m?'1':'0');}catch(e){}}
$('mute').addEventListener('click',()=>{initAudio();setMute(!muted);});setMute(muted);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(running&&!paused)togglePause();else if(AC)AC.suspend();}});
document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
if(matchMedia('(pointer:coarse)').matches)$('hint').textContent='Joystick do końca: przyspieszenie. Szarpnięcie w tył: przewrót.';

resize();setWeaponUI();buildMini();updHud();
updateChunks(cam.x,cam.z,999);
requestAnimationFrame(t=>{last=t;loop(t);});
})();
</script>
